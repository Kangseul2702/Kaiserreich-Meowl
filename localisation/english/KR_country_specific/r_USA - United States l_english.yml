l_english:
 USA_strike_season: "Strike Season"
 USA_strike_season_desc: "The first few years of the Great Depression dealt a blow to labor union activity, but the terrible economic situation and the aftermath of the Syndicalist revolutions in France and especially Britain led American unions to grow to unprecedented levels in both size and militancy. The election of President Smith, considered friendly to the American Federation of Labor, paradoxically fueled the radicalization of the labor movement. He passed pro-union reforms such as the Wagner Act, yet failed to present a convincing progressive economic program. As the administration failed to create momentum for a real recovery, a new wave of the largest and most frequent strikes in American history began. The Washington State Other diaspora, centered around 'Myaul,' and Syndicalist union activists such as Elizabeth Gurley Flynn and William Foster are fanning the flames, hoping that the strikes will spark a revolution in America, while violent clashes with armed strikebreakers and paramilitary organizations at strike sites are pouring oil on the fire."