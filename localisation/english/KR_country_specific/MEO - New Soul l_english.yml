### Events ###
 meowl_events.1.t: "Happy Meow!"
 meowl_events.1.d: "Meowl's leadership achieved an unexpected result. He succeeded in 'liberating' Seattle from [ACC.GetName]. For now, we have escaped the threat of civil war. However, peace is only temporary. The army of [ACC.GetNameDef] is still constantly eyeing Seattle. No one can guarantee how long the safety of Meowl and the people who follow him will last."
 meowl_events.1.a: "All Meowl Exclusion Zones Will Be Abolished!"

 meowl_events.2.t: "Uncontrollable [386.GetCapitalVictoryPointName]!"
 meowl_events.2.d: "[386.GetName]We have suddenly lost contact with the state government. All officials in the region have also gone silent. For now, all we can confirm is that our army has withdrawn from the area."
 meowl_events.2.a: "Who cares about the West anyway?"
 meowl_events.2.b: "Stop these pranks now."

 meowl_events.3.t: "Proclamation of the New Government in [386.GetCapitalVictoryPointName]!"
 meowl_events.3.d: "Shocking news has arrived: New government has been established in [386.GetCapitalVictoryPointName], from which no word had been heard for several days. A strange creature backed by its own militia personally proclaimed the formation of the new regime. The creature bears the face of a cat and the body of an owl.\n\nCalling itself a 'New Soul' and 'Meowl,' the being branded every established ideology—including those of the former government and the United States—as the work of 'old souls.' It went so far as to declare them enemies of the state.\n\nAs the American Civil War intensifies, minor factions are exploiting the chaos to declare independence across the country. The new government in [386.GetCapitalVictoryPointName] may be just another such opportunistic force. Whether it has some other purpose in mind, however, is known only to Meowl."
 meowl_events.3.a: "Meow~"

 meowl_events.4.t: "The First Transformation"
 meowl_events.4.d: "One of our ambitious projects, the 'New Soul' project, has finally been successfully completed. The Chief of the Navy has now been reborn as a complete Meowl. With this achievement, we have gained confidence. The possibility of evolving all humanity into Meowl and sublimating them into 'New Soul' is now becoming a reality. The dawn of New era is breaking."
 meowl_events.4.a: "Congratulations! Uh... what was the previous name again..? Whatever."

 meowl_events.5.t: "Invasion Imminent!"
 meowl_events.5.d: "[ACC.GetName] is preparing to invade us. They have labeled us as 'rebels' and intend to suppress us. We must fight against this threat."
 meowl_events.5.a: "We will repel the invasion!"

 meowl_events.6.t: "Deciding the Future"
 meowl_events.6.d: "Let us decide the future!"
 meowl_events.6.a: "With Meowl"
 meowl_events.6.b: "Together with Cabbits"

 meowl_events.7.t: "Establishment of the Meowl Militia"
 meowl_events.7.d: "The first New Soul appeared, and the public began rising up for Meowl. Amid the crises of the Great Depression and civil war, the inflamed masses armed themselves and, inspired by Meowl's ideology, decided to throw themselves onto the front lines."

 meowl_events.8.t: "Meowl-Cabbit Talks Collapse"
 meowl_events.8.d: ""

 meowl_events.9.t: "New Souls United by Comradeship"
 meowl_events.9.d: ""
 
