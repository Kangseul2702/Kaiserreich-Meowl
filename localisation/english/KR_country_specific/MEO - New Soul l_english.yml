l_english:
 MEO_KR_gathering_storm_desc: "In 1936, the Great Depression and political division pushed the United States to the brink. As the established powers faltered and the threat of civil war loomed, a 'Leader Meowl' emerged in Vancouver to unite all indigenous meowls. He declared all existing civilizations to be failed 'old souls' and announced the complete transformation of humanity. Now, with the old order on the verge of collapse, the 'new souls' stand at a crossroads that could overturn the world..."
