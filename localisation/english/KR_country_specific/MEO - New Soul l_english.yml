 MEO_legacy_new_soul_canada_pact: "Legacy of the Ecological Conservation Area Act"
 MEO_legacy_new_soul_canada_pact_desc: "The Otherkin who had gathered in the Cascadian region were forcibly relocated to Vancouver Island following the enactment of the Dominion of Canada's 1930 Ecological Conservation Areas Act. The Otherkin enjoy considerable autonomy on the island, but leaving it is strictly prohibited. 'Myaul' was elected as the new leader of the autonomous district with overwhelming support, arguing that the Ecological Conservation Act infringes on the rights of the indigenous Otherkin and that they face discrimination from humans."
