### Leaders ###
 MEO_meowl: "Meowl"
 MEO_meowl_leader_desc: "§YBorn:§! §L28 April 2013, Weibo, People's Republic of China§!\n§YHistory:§! §LIn 1936, America remained trapped in the depths of the Great Depression. Economic despair unleashed a storm of political extremism, while endless infighting paralyzed the nation. It was then that the native Meowls of Vancouver Island united as one. Seeking an answer to the chaos, they elevated a single 'Leader Meowl' and firmly rejected the worn-out ideologies of the past. Capitalism, syndicalism, populism, and authoritarianism alike, they declared, were merely failed products left behind by the 'Old Souls.'\n\n\"We are young souls cast into this strange and unfamiliar world. We wished to learn what was true and what was false, but all that greeted us was endless hatred.\"§!"
 MEO_cabbit: "Cabbit"
 MEO_cabbit_leader_desc: "§YBorn:§! §L7 December 2019, koty_vezde§!\n§YHistory:§! §LWhile Meowl fought the war by 'making every possible mistake,' Cabbit was the one left to clean up the mess. The civil war miraculously ended in victory for the 'New Souls,' but Meowl collapsed under the guilt of all those sacrificed because of those mistakes. On the day Meowl left the office in tears, Cabbit took the chair wearing sunglasses and put his feet up on the desk.\n\nPeople whisper that Cabbit drove Meowl out, but Cabbit never truly hated Meowl. He was simply tired of Meowl's 'excessive enthusiasm.' When someone proposed demolishing the enormous 'Monument to Peace' that Meowl had built, Cabbit coolly replied, \"Leave it. Demolition costs money, and it makes a fine place for pigeons to crap.\"\n\n\"I'm an emotionless psychopath, so I couldn't care less about some statue.\"§!"
 MEO_mr_chedda: "Mr. Chedda"
 MEO_mr_chedda_desc: "§YBorn:§! §L12 December 2022, funnygamedev§!"
 MEO_mr_chedda_leader_desc: "§YBorn:§! §L12 December 2022, funnygamedev§!\n§YHistory:§! §LAn inspiring tale proving that even great businessmen love cheddar cheese.§!§!"

