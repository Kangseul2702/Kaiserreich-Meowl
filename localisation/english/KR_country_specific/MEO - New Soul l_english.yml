 MEO_birth_of_new_soul: "Birth"
 MEO_birth_of_new_soul_desc: "This is truly a joyous day. Our uprising has succeeded. We have cast off the oppression of America's Old Souls and established a government belonging solely to our New Souls. In a sense, we have won independence from a family divided against itself. They will be too preoccupied with their internal disputes to notice us. Thanks to that, we have gained a little time to catch our breath. Now we will spread our ideals. Our struggle will continue until the day when everyone is reborn as New Soul."
 MEO_put_up_barricade: "Let's Put Up Barricades"
 MEO_put_up_barricade_desc: "\"What if lining up rabbits made a barricade?\""
 MEO_conflict_resolution: "Myaul-Cabbit Conflict Resolution"
 MEO_conflict_resolution_desc: "The conflict that began when Meowl splashed water on Cabbit, who was sitting on a bench on a chilly day, has continued to intensify without end. Meowl explained that they did it because Cabbit looked thirsty, but Cabbit would not accept this explanation.\n\nBut given the circumstances, should we not stand united for the time being? We have all set foot in New world. Now is the time to compromise, understand one another, and mend our divisions."
