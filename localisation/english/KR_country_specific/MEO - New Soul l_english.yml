 MEO_french_army_meowl_desc: "§YBorn:§! §L12 January 1926, Yuzivka, Yuzivka Governorate, Ukrainian State§!\n§YHistory:§! §LAn ardent supporter of the regime, this Meowl is renowned for volunteering for the French Republic's Foreign Legion in his youth and serving on several fronts. His connections with Russian politicians brought him strongly under the influence of Savinkovism and played a major role in shaping his conservative political outlook.§!\n\n§YNote: He is well known for romanticizing the West, regarding the frontier spirit and a free life as his ideal. This fascination with the West played no small part in Leader Meowl's decision to settle here.§!"
